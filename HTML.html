<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo de Estudos</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <main class="tudo">

    <aside id="barra-lateral">
        <nav>
            <div>
                <img class="logo" src="Imagens/Logo.png" alt="Logo do site">
            </div>
            <div class="dashboard">
                <img src="/Imagens/painel-de-controle.png" alt="Dashboard">
                <h3>Dashboard</h3>
            </div>

            <div class="ciclo-de-estudos">
                <img src="/Imagens/ciclo.png" alt="Ciclo">
                <h3>Ciclo de Estudos</h3>
            </div>
            
            <div class="materias">
                <img src="/Imagens/livro.png" alt="Dashboard">
                <h3>Matérias</h3>
            </div>
        </nav>
    </aside>

    <div class="conteudo">
        
        <div class="mensagem-boasvindas">
            <h1 class="titulo">Olá, estudante!</h1>
            <p>Continue de onde parou.</p>
        </div>
        
        <div class="container">
            <div class="bloco-1">
                <img src="/Imagens/livro.png" alt="Relógio">
                <h1>12h</h1>
                <p>Horas estudadas</p>
            </div>
        
            <div class="bloco-2">
                <img src="/Imagens/livro.png" alt="Relógio">
                <h1>80%</h1>
                <p>Meta Semanal</p>
            </div>

            <div class="bloco-3">
                <img src="/Imagens/livro.png" alt="Relógio">
                <h1>24</h1>
                <p>Total de Sessões</p>
            </div>
            
        </div>
        
        <div>
            <div class="bloco-4">
                <h1>Matérias da Semana</h1>
                    <p><br>Tecnologia:</p>
                 <div class="barra-fundo">
                    <div class="barra-progresso"></div>
                </div>
            <br>
                <p><br>Português:</p>
                 <div class="barra-fundo">
                    <div class="barra-progresso"></div>
                </div>
            <br>
                <p><br>Legislação:</p>
                 <div class="barra-fundo">
                    <div class="barra-progresso"></div>
                </div>
                
            </div>
        </div>

    </div>

    </main>
    
</body>
</html>
